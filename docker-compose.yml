x-minio-common: &minio-common
  image: minio/minio:latest
  command: server --console-address ":9090" /mnt/data
  ports:
    - "9000:9000"
    - "9090:9090"
  healthcheck:
    test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    interval: 30s
    timeout: 20s
    retries: 3

services:
  web_nginx:
    image: nginx:latest
    container_name: web_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx:/etc/nginx/conf.d
    networks:
      - app-network
    depends_on:
      - clients_go
      - profile

  auth_go:
    build:
      context: .
      dockerfile: ./cmd/auth/Dockerfile
    ports:
      - "44000:44000"
    image: auth-go-image
    container_name: auth_go
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - postgres
      - redis

  relations_go:
    build:
      context: .
      dockerfile: ./cmd/relations/Dockerfile
    ports:
      - "44002:44002"
    image: relations-go-image
    container_name: relations_go
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - mongo_db

  clients_go:
    build:
      context: .
      dockerfile: ./internal/clients/Dockerfile
    ports:
      - "8000:8000"
    image: clients-go-image
    container_name: clients_go
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./files:/app/files

  mongo_db:
    image: mongo
    container_name: mongo-db
    volumes:
      - mongo_data:/data/db
    environment:
      #- MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      #- MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    networks:
      - app-network

  postgres:
    image: postgres:16.4
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5430:5432"
    volumes:
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data/
    networks:
      - app-network

  redis:
    image: redis
    container_name: redis_container
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  minio:
    <<: *minio-common
    hostname: minio
    container_name: minio_db
    volumes:
      - type: bind
        source: /mnt/data/compose
        target: /mnt/data
      - type: bind
        source: /etc/default/minio
        target: /etc/config.env
    networks:
      - app-network

  profile:
    build: services/profile
    container_name: profile_py
    command: >
      sh -c "poetry run alembic upgrade head && poetry run python3 -m main"
    ports:
      - "9999:9999"
    volumes:
      - ./app:/app/app
    networks:
      - app-network
    depends_on:
      - postgres
      - minio
    restart: unless-stopped
  chats:
    build: services/chat
    container_name: chats_py
    command: >
      sh -c "poetry run alembic upgrade head && poetry run python3 -m main"
    ports:
      - "9091:9091"
    volumes:
      - ./app:/app/app
    networks:
      - app-network
    depends_on:
      - postgres
    restart: unless-stopped

  # frontend:
  #   ports:
  #     - "3000:3000"
  #   image: discord-frontend
  #   container_name: discord_frontend
  #   networks:
  #     - app-network


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  # 2. Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-container
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Блокируем выполнение, пока Kafka не будет готова (ждем до 30 сек)
      echo -e 'Waiting for kafka to be ready...'
      cub kafka-ready -b kafka-container:29092 1 30

      # Создаем топики
      echo -e 'Creating kafka topics...'
      kafka-topics --bootstrap-server kafka-container:29092 --create --if-not-exists --topic chat-in --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka-container:29092 --create --if-not-exists --topic chat-out --replication-factor 1 --partitions 1

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka-container:29092 --list
      "
    networks:
      - app-network

  # 3. Kafka UI (Веб-интерфейс)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - app-network
volumes:
  minio_data:
  pg_data:
  go_back:
  mongo_data:
  redis_data:


networks:
  app-network:
    driver: bridge
