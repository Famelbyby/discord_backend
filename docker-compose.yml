x-minio-common: &minio-common
  image: minio/minio:latest
  command: server --console-address ":9090" /mnt/data
  ports:
    - "9000:9000"
    - "9090:9090"
  healthcheck:
    test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    interval: 30s
    timeout: 20s
    retries: 3

services:
  # logger_host:
  #   container_name: $COMPOSE_PROJECT_NAME
  #   image: $COMPOSE_PROJECT_NAME:1.0
  #   build:
  #     dockerfile: Dockerfile
  #     context: $CURRENTPATH
  #   ports:
  #     - "12345:12345"
  #     - "3100:3100"
  #     - "3000:3000"
  #   volumes:
  #     - db-data:/loki
  #     - grafana-storage:/var/lib/grafana
  #   entrypoint: "/bin/sh -c /entry_point.sh"


  minio:
    <<: *minio-common
    hostname: minio
    volumes:
      - type: bind
        source: /mnt/data/compose
        target: /mnt/data
      - type: bind
        source: /etc/default/minio
        target: /etc/config.env
  profile:
    build: services/profile
    command: >
      sh -c "poetry run alembic upgrade head && poetry run python3 -m main"
    ports:
      - "9999:9999"
    volumes:
      - ./app:/app/app
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5430:5432"
    volumes:
      - profiles_data:/var/lib/postgresql

volumes:
  minio_data:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /IO/loki_data
  profiles_data:
  grafana-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /IO/grafana_data
