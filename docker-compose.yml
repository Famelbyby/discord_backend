services:
  # logger_host:
  #   container_name: $COMPOSE_PROJECT_NAME
  #   image: $COMPOSE_PROJECT_NAME:1.0
  #   build:
  #     dockerfile: Dockerfile
  #     context: $CURRENTPATH
  #   ports:
  #     - "12345:12345"
  #     - "3100:3100"
  #     - "3000:3000"
  #   volumes:
  #     - db-data:/loki
  #     - grafana-storage:/var/lib/grafana
  #   entrypoint: "/bin/sh -c /entry_point.sh"

  profile:
    build: services/profile
    command: >
      sh -c "poetry run alembic upgrade head && poetry run python3 -m main"
    ports:
      - "9000:9000"
    volumes:
      - ./app:/app/app
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
      # volumes:
      # - ./pgdata:/var/lib/postgresql/data/pgdata

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /IO/loki_data
  grafana-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /IO/grafana_data
